<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #007acc;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }
        h1 {
            font-size: 28px;
            color: #222;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #007acc;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #005999;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- यहाँ आप अपना नाम का पहला अक्षर बदल सकते हैं -->
        <div class="profile-img">M</div>
        <h1>नमस्ते, आपका स्वागत है!</h1>
        <p>यह मेरी पर्सनल वेबसाइट है जिसे मैं वेब डेवलपमेंट सीखते समय बना रहा हूँ। इस वेबसाइट के कोड को मैं सीधे GitHub Desktop के ज़रिए GitHub पर अपलोड करूँगा।</p>
        <a href="#" class="btn">मेरे प्रोजेक्ट्स देखें</a>
    </div>

</body>
</html>
